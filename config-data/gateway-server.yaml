server:
  port: 8080

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
      hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: microservice-user
          uri: lb://microservice-user
          predicates:
            - Path=/user/**
          filters:
            -AuthFilter
        - id: microservice-car
          uri: lb://microservice-car
          predicates:
            - Path=/car/**
        - id: microservice-motorcycle
          uri: lb://microservice-motorcycle
          predicates:
            - Path=/motorcycle/**
        - id: microservice-auth
          uri: lb://microservice-auth
          predicates:
            - Path=/auth/**
          

