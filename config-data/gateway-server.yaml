server:
  port: 8080

eureka:
    client:
        register-with-eureka: true
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
      hostname: localhost

spring:
  cloud:
    gateway:
      default-filters:
        - TokenRelay
      discovery:
        locator:
          enabled: true
      routes:
        - id: microservice-user
          uri: lb://microservice-user
          predicates:
            - Path=/user/**
          filters:
            - RemoveRequestHeader=Cookie
        - id: microservice-car
          uri: lb://microservice-car
          predicates:
            - Path=/car/**
        - id: microservice-motorcycle
          uri: lb://microservice-motorcycle
          predicates:
            - Path=/motorcycle/**

        - id: microservice-auth
          uri: lb://microservice-auth
          predicates:
            - Path=/auth/**
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: http://localhost:9090/realms/tutorial-realm/protocol/openid-connect/auth
            userinfo-uri: http://localhost:9090/realms/tutorial-realm/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
            token-uri: http://localhost:9090/realms/tutorial-realm/protocol/openid-connect/token
        registration:
          tutorial-client:
            provider: keycloak
            client-id: tutorial-client
            client-secret: lKnpDRnowbfEgjt4CqlElDC7Q5iDBRv9
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/tutorial-client