spring:
  application:
    name: microservice-user
    cloud:
      config:
        enabled: true
        uri: http://localhost:8081

  datasource:
    url: jdbc:mysql://localhost:3306/microserviceuser
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      database-platform: org.hibernate.dialect.MySQL8Dialect
      show-sql: true
      hibernate:
        ddl-auto: update